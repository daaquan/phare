# phpfan.net -- reference copy of /etc/nginx/conf.d/phpfan.net.conf with the
# real client IP restored (DRAFT: not installed; apply by hand, then
# `sudo nginx -t && sudo systemctl reload nginx`).
#
# Traffic path: Cloudflare -> cloudflared (tunnel, 127.0.0.1) -> nginx -> php-fpm.
# Without real_ip every request reaches PHP as REMOTE_ADDR=127.0.0.1, so
# per-IP rate limits become one bucket shared by every visitor.
#
# Only loopback is trusted: a client that reaches port 80 directly cannot set
# its own address with a forged CF-Connecting-IP. The application also
# resolves CF-Connecting-IP itself when REMOTE_ADDR is a trusted proxy
# (App\Support\Http\ClientIp, TRUSTED_PROXIES), so both layers agree.
server {
    listen 80;
    server_name phpfan.net;

    # --- added: restore the visitor IP from cloudflared ---------------------
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    # -------------------------------------------------------------------------

    root /opt/phare/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Optional, once HTTPS-only is confirmed for every phpfan.net client:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff2?|ttf|svg|webp|webm|mp4)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffering off;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }
}
