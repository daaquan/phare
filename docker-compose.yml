volumes:
  mysql:
    driver: local

services:
    db:
        image: mysql:8.0
        container_name: db
        environment:
          TZ: "Asia/Tokyo"
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: "api"
          MYSQL_USER: "api"
          MYSQL_PASSWORD: "secret"
        ports:
            - "3306:3306"
        volumes:
            - mysql:/var/lib/mysql

    php-fpm:
        build: docker/php
        container_name: php
        environment:
            TZ: Asia/Tokyo
        ports:
            - "9000:9000"
        volumes:
            - .:/var/www/html
            - ../framework:/var/www/framework
            - ./docker/php/config/extra.ini:/usr/local/etc/php/conf.d/extra.ini

    nginx:
        image: nginx
        container_name: nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./storage/logs:/var/log/nginx
            - ./docker/nginx/sites-enabled:/etc/nginx/conf.d
            - .:/var/www/html

    redis:
        image: redis:6
        container_name: redis
        ports:
            - "6379:6379"
